name: Feature request
description: Suggest something
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit Firelight?
      options:
        - label: It works against a stock Audiobookshelf server
        - label: It does not require collecting any data
        - label: It is free for everyone
